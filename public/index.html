<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Unlock & Admin Center</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .admin-box { background: #343a40; color: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: 40px auto; text-align: left; }
    </style>
</head>
<body>

    <h1>Unlock Your Task Instantly</h1>
    
    <div class="card">
        <h3>Task #1: Premium Material</h3>
        <p>Pay KES 50 to unlock full instructions and answers.</p>
        <input type="text" id="phone" placeholder="Enter your M-Pesa phone number (e.g. 0712345678)">
        <button onclick="unlockTask()">Pay & Unlock Task</button>
        <p id="status-msg" style="font-weight: bold; color: #007bff;"></p>
    </div>

    <div class="admin-box">
        <h3>Admin Center Login</h3>
        <input type="text" id="admin-user" placeholder="Username (default: admin)">
        <input type="password" id="admin-pass" placeholder="Password">
        <button onclick="adminLogin()">Login to Admin Panel</button>
        <div id="admin-dashboard" style="display:none; margin-top: 15px;">
            <h4>Admin Dashboard</h4>
            <p><strong>Total Wallet Balance:</strong> KES <span id="wallet-balance">0</span></p>
            <button style="background: #ffc107; color: black;" onclick="alert('Withdrawal request submitted to your bank/M-Pesa!')">Withdraw Funds</button>
        </div>
    </div>

    <script>
        async function unlockTask() {
            const phone = document.getElementById('phone').value;
            const msg = document.getElementById('status-msg');
            msg.innerText = "Sending M-Pesa prompt to your phone...";

            const res = await fetch('/api/unlock-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phone, amount: 1 }) // 1 KES for sandbox testing
            });
            const data = await res.json();
            if(data.success) {
                msg.innerText = data.message;
            } else {
                msg.innerText = "Error triggering prompt.";
            }
        }

        async function adminLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            if(data.success) {
                alert("Login successful!");
                document.getElementById('admin-dashboard').style.display = 'block';
                fetchDashboard();
            } else {
                alert("Access Denied: Wrong credentials.");
            }
        }

        async function fetchDashboard() {
            const res = await fetch('/api/admin/dashboard');
            const data = await res.json();
            if(data.success) {
                document.getElementById('wallet-balance').innerText = data.totalBalance;
            }
        }
    </script>
</body>
</html>
